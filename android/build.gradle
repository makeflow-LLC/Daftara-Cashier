// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // ماسح الباركود: نستبدل نسخة ML Kit المضمّنة (~2.5MB لكل معالج) بالنسخة غير المضمّنة من خدمات Google Play
    // (نفس الواجهة البرمجية تمامًا، والنموذج يُنزَّل مرة واحدة على الجوال). في كل المشاريع حتى تُبنى الإضافة عليها أيضًا.
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module("com.google.mlkit:barcode-scanning") using module("com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
