<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e7a51">
<title>كتالوج المحل</title>
<!-- كتالوج المحل للزبائن: أصناف المحل وأسعارها، يختار الزبون ثم «اطلب عبر واتساب» فتصل رسالة الطلب جاهزة لصاحب المحل.
     shop.html?s=<معرّف المحل> — البيانات من دالة cashier_shop_catalog (تعمل فقط إن شغّل صاحب المحل الكتالوج).
     كل صنف بوحدته (قطعة، كيلو، أوقية…) وصورته إن وُجدت — المنطق في src/domain/catalog.js. -->
<style>
:root{--bg:#f3f2f2;--card:#fff;--ink:#201e1d;--muted:#605d5d;--line:rgba(32,30,29,.12);--brand:#0e7a51;--brand-100:#e8f5ee;--brand-700:#085134;
  --grad:linear-gradient(135deg,#0e7a51 0%,#0b6b63 55%,#0a5577 100%);--danger:#aa0b56;
  --font:"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --num:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
button{font:inherit;cursor:pointer;border:0}
[hidden]{display:none!important}
.num{font-family:var(--num);direction:ltr;unicode-bidi:isolate}
header{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 22px;border-radius:0 0 24px 24px}
header h1{margin:0 0 4px;font-size:26px}
header p{margin:2px 0;opacity:.9;font-size:15px}
.msg{margin-top:10px;background:rgba(255,255,255,.16);padding:10px 12px;border-radius:12px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 12px;min-height:50px}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;background:transparent;padding:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(45,43,43,.12);font-size:15px;min-height:40px}
.chip.on{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.item{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(45,43,43,.12);min-height:140px}
.item .name{font-weight:700;font-size:16px;line-height:1.4}
.item .price{color:var(--brand-700);font-weight:700;font-size:17px;margin-top:auto}
.item .unit{color:var(--muted);font-size:13px;font-weight:400}
.item.off{opacity:.55}
.badge{align-self:flex-start;background:var(--brand-100);color:var(--brand-700);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.pic{position:relative;display:block;width:100%;height:0;padding:78% 0 0;border-radius:12px;background:var(--brand-100);overflow:hidden}
.pic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.pic img.in{opacity:1}
.pic img.now{transition:none}
.pic span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:34px;font-weight:700;color:var(--brand);opacity:.35}
button.pic{cursor:zoom-in}
.view{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:6;padding:16px;cursor:zoom-out}
.view img{max-width:100%;max-height:80vh;border-radius:14px;background:#fff}
.view p{margin:0;color:#fff;font-weight:700;font-size:17px;text-align:center}
.add{background:var(--brand);color:#fff;border-radius:12px;min-height:44px;font-weight:700;font-size:15px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--brand-100);border-radius:12px;min-height:44px}
.step button{width:44px;height:44px;background:transparent;color:var(--brand-700);font-size:22px;font-weight:700}
.step span{font-weight:700;color:var(--brand-700);text-align:center;line-height:1.25}
.na{color:var(--danger);font-size:14px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(243,242,242,.96);border-top:1px solid var(--line)}
.bar button{width:100%;max-width:828px;display:flex;margin:0 auto;align-items:center;justify-content:space-between;gap:10px;background:#1fa855;color:#fff;border-radius:16px;min-height:58px;padding:0 18px;font-weight:700;font-size:17px;box-shadow:0 8px 20px rgba(14,122,81,.3)}
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:20px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:12px 0}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:14px}
.field{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.go{width:100%;margin-top:14px;background:#1fa855;color:#fff;border-radius:14px;min-height:54px;font-weight:700;font-size:17px}
.ghost{width:100%;margin-top:8px;background:transparent;color:var(--muted);min-height:44px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
footer a{color:var(--brand-700)}
</style>
</head>
<body>
<header id="head"><h1>…</h1></header>
<main>
  <div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="ابحث عن صنف" autocomplete="off"></div>
  <div class="chips" id="cats"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
  <footer>كتالوج بواسطة <a href="https://makeflow.tech/apps/cashier/" rel="noopener">دفترة كاشير</a></footer>
</main>
<div class="bar" id="bar" hidden><button id="order" type="button"><span>اطلب عبر واتساب</span><span id="sum"></span></button></div>
<script src="config.js"></script>
<script type="module">
import { normalizePhone, whatsappLink } from './src/domain/ledger.js';
import { formatMoney } from './src/domain/currency.js';
import { nextQty, qtyText, unitBadge, priceUnit, chosenItems, itemText, orderText, imageUrl } from './src/domain/catalog.js';
import { normalizeArabic } from './src/domain/product.js';

const $ = (id) => document.getElementById(id);
// بديل حديث غير مدعوم في متصفحات الجوالات القديمة: نفرّغ العنصر ثم نضيف
const fill = (e, ...kids) => { e.textContent = ''; for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : String(c)); };
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : String(c)); return e; };
const shopId = new URLSearchParams(location.search).get('s') || '';
const cfg = window.CASHIER_CONFIG || {};
const key = `catalog-cart2:${shopId}`; // الكميات بالألف وبوحدة كل صنف
let shop = null, cat = null, withPics = false;
let cart = {};
try { cart = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch { cart = {}; }
const saveCart = () => { try { localStorage.setItem(key, JSON.stringify(cart)); } catch { /* */ } };
const money = (v) => formatMoney(v, shop?.currency || 'ILS');

function fail(text) {
  fill($('head'), el('h1', {}, 'الكتالوج غير متاح'), el('p', {}, text));
  document.querySelector('main').hidden = true;
}

async function load() {
  if (!/^[0-9a-f-]{36}$/i.test(shopId) || !cfg.supabaseUrl) { fail('الرابط غير صحيح. اطلب من المحل الرابط من جديد.'); return; }
  try {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/cashier_shop_catalog`, {
      method: 'POST', headers: { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_shop: shopId }),
    });
    if (!r.ok) throw new Error(String(r.status));
    shop = await r.json();
  } catch { fail('تعذّر الاتصال — تأكد من الإنترنت ثم أعد فتح الرابط.'); return; }
  if (!shop) { fail('أوقف المحل الكتالوج مؤقتًا. تواصل معهم مباشرة.'); return; }
  document.title = `${shop.name} — اطلب عبر واتساب`;
  fill($('head'), 
    el('h1', {}, shop.name),
    shop.address ? el('p', {}, '📍 ', shop.address) : null,
    shop.phone ? el('p', {}, '📞 ', el('span', { class: 'num' }, shop.phone)) : null,
    shop.message ? el('div', { class: 'msg' }, shop.message) : null);
  const ids = new Set(shop.products.map((p) => p.id));
  for (const id of Object.keys(cart)) if (!ids.has(id)) delete cart[id];
  // خانة الصورة تظهر في كل البطاقات إن كان لصنف واحد على الأقل صورة؛ وإلا تبقى البطاقات صغيرة كما هي
  withPics = shop.products.some((p) => imageUrl(cfg.supabaseUrl, p.image));
  paint();
}

function paint() {
  const used = new Set(shop.products.map((p) => p.category_id).filter(Boolean));
  const cats = shop.categories.filter((c) => used.has(c.id));
  const chip = (id, name) => el('button', { class: `chip ${cat === id ? 'on' : ''}`, type: 'button', onclick: () => { cat = id; paint(); } }, name);
  fill($('cats'), ...(cats.length ? [chip(null, 'الكل'), ...cats.map((c) => chip(c.id, c.name))] : []));
  const q = normalizeArabic($('q').value || '');
  const list = shop.products.filter((p) => (!cat || p.category_id === cat) && (!q || normalizeArabic(p.name).includes(q)));
  fill($('grid'), ...list.map(card));
  $('empty').hidden = list.length > 0;
  $('empty').textContent = shop.products.length ? 'لا أصناف بهذا الاسم' : 'لا أصناف في الكتالوج بعد';
  paintBar();
}

// ---------- صور الأصناف (اختيارية): المصغّرة حين تظهر البطاقة، والكاملة عند الضغط ----------
// التخزين خاص، فالصورة تُجلب بمفتاح الصفحة ثم تُعرض. ما فشل (لم تُرفع بعد) يبقى مكانه الحرف الأول.
const pics = new Map(); // العنوان → Promise<objectURL | null>
const ready = new Map(); // ما نزل فعلًا: يُعرض فورًا حين تُعاد رسم البطاقات (كل ضغطة + تعيد الرسم)
function picture(url) {
  if (!pics.has(url)) {
    pics.set(url, fetch(url, { headers: { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}` } })
      .then((r) => (r.ok ? r.blob() : null)).then((b) => (b && b.size ? URL.createObjectURL(b) : null)).catch(() => null)
      .then((u) => { if (u) ready.set(url, u); return u; }));
  }
  return pics.get(url);
}
const show = (img, url) => picture(url).then((u) => { if (u) { img.src = u; img.classList.add('in'); } });
const seen = 'IntersectionObserver' in window ? new IntersectionObserver((list) => {
  for (const x of list) if (x.isIntersecting) { seen.unobserve(x.target); show(x.target, x.target.dataset.src); }
}, { rootMargin: '300px' }) : null;

function pic(p) {
  const thumb = imageUrl(cfg.supabaseUrl, p.image);
  const letter = el('span', { 'aria-hidden': 'true' }, [...p.name.trim()][0] || '');
  if (!thumb) return el('div', { class: 'pic' }, letter);
  const img = el('img', { alt: p.name, 'data-src': thumb });
  if (ready.has(thumb)) { img.src = ready.get(thumb); img.className = 'in now'; }
  else if (seen) seen.observe(img); else show(img, thumb);
  return el('button', { class: 'pic', type: 'button', 'aria-label': `صورة ${p.name}`, onclick: () => zoom(p, img) }, letter, img);
}

function zoom(p, small) {
  if (!small.src) return;
  const big = el('img', { alt: p.name, src: small.src });
  const view = el('div', { class: 'view', onclick: () => view.remove() }, big, el('p', {}, p.name));
  document.body.append(view);
  picture(imageUrl(cfg.supabaseUrl, p.image, { full: true })).then((u) => { if (u) big.src = u; });
}

function card(p) {
  const n = cart[p.id] || 0;
  const per = priceUnit(p.unit);
  const badge = unitBadge(p.unit);
  const ctl = !p.available ? el('span', { class: 'na' }, 'غير متوفر الآن')
    : n ? el('div', { class: 'step' },
      el('button', { type: 'button', 'aria-label': 'زيادة', onclick: () => set(p, nextQty(p.unit, n, 1)) }, '+'),
      el('span', per ? {} : { class: 'num' }, qtyText(p.unit, n)),
      el('button', { type: 'button', 'aria-label': 'إنقاص', onclick: () => set(p, nextQty(p.unit, n, -1)) }, '−'))
      : el('button', { class: 'add', type: 'button', onclick: () => set(p, nextQty(p.unit, 0, 1)) }, 'أضف للطلب');
  return el('div', { class: `item ${p.available ? '' : 'off'}` },
    withPics ? pic(p) : null,
    el('div', { class: 'name' }, p.name),
    badge ? el('span', { class: 'badge' }, badge) : null,
    el('div', { class: 'price' }, el('span', { class: 'num' }, money(p.price)), per ? el('span', { class: 'unit' }, ` / ${per}`) : null),
    ctl);
}

function set(p, n) {
  if (n > 0) cart[p.id] = n; else delete cart[p.id];
  saveCart(); paint();
}

const chosen = () => chosenItems(shop.products, cart);
const sumOf = (items) => items.reduce((a, x) => a + x.total, 0);

function paintBar() {
  const items = chosen();
  $('bar').hidden = !items.length;
  fill($('sum'), el('span', {}, `${items.length} صنف · `, el('span', { class: 'num' }, money(sumOf(items)))));
}

$('order').addEventListener('click', () => {
  const items = chosen();
  const name = el('input', { class: 'field', autocomplete: 'name', placeholder: 'اختياري' });
  const note = el('textarea', { class: 'field', rows: '2', placeholder: 'توصيل، وقت الاستلام… (اختياري)' });
  const sheet = el('div', { class: 'sheet', onclick: (e) => { if (e.target === sheet) sheet.remove(); } }, el('div', {},
    el('h2', {}, 'طلبك'),
    ...items.map((x) => el('div', { class: 'line' }, el('span', {}, itemText(x.p, x.qty)), el('span', { class: 'num' }, money(x.total)))),
    el('div', { class: 'total' }, el('span', {}, 'المجموع التقريبي'), el('span', { class: 'num' }, money(sumOf(items)))),
    el('label', {}, 'اسمك'), name, el('label', {}, 'ملاحظة'), note,
    el('button', { class: 'go', type: 'button', onclick: () => send(items, name.value.trim(), note.value.trim()) }, 'أرسل الطلب على واتساب'),
    el('button', { class: 'ghost', type: 'button', onclick: () => sheet.remove() }, 'رجوع')));
  document.body.append(sheet);
});

function send(items, name, note) {
  location.href = whatsappLink(normalizePhone(shop.phone || ''), orderText({ shopName: shop.name, items, name, note, money }));
}

$('q').addEventListener('input', () => shop && paint());
load();
</script>
</body>
</html>
